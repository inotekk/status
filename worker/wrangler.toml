# Worker de la page de statut : (1) déclenche la sonde Upptime (Uptime CI)
# toutes les 5 minutes via l'API GitHub, à la place du cron GitHub Actions
# (trop irrégulier aux heures de charge) — le cron GitHub de uptime.yml est
# réduit à un filet de sécurité quotidien (cf. workflowSchedule dans
# .upptimerc.yml) ; (2) passerelle SMS Brevo pour les incidents (appelée par
# le workflow alerte-sms-incidents.yml). Secrets requis : voir l'en-tête de
# index.js (GITHUB_TOKEN, SMS_HOOK_TOKEN, BREVO_API_KEY, ALERTE_SMS_TO).
name = "vigiao-status-cron"
main = "index.js"
compatibility_date = "2026-07-01"

[triggers]
crons = ["*/5 * * * *"]
