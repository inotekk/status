# Configuration Upptime de la page de statut VIGIAO (status.vigiao.fr).
# Sondes toutes les ~5 minutes depuis GitHub Actions (infrastructure
# indépendante de la nôtre), incidents ouverts en issues GitHub, page
# publiée sur GitHub Pages. Docs : https://upptime.js.org/docs/configuration
owner: inotekk
repo: status
customStatusWebsitePackage: "@upptime/status-page@github:inotekk/status-page#v1.17.0-fr.4"

# Périmètre CNP-16 : les quatre interfaces publiques de la plateforme,
# complétées par la santé fonctionnelle du provisionnement des accès clients.
sites:
  - name: Application VIGIAO
    url: https://ao.inotekk.com/api/v1/health
    slug: application-vigiao
  - name: Veille marchés publics
    url: https://vigi.inotekk.com/healthz
    slug: veille-marches-publics
  - name: Site vigiao.fr
    url: https://vigiao.fr
    slug: site-vigiao-fr
  - name: Ma veille
    url: https://veille.vigiao.fr
    slug: espace-client
  # Le endpoint ne publie que des compteurs agrégés. Une réponse 503 signifie
  # qu'au moins une synchronisation de droits est bloquée et doit donc ouvrir
  # un incident distinct, même si l'interface Ma veille répond encore.
  - name: Provisionnement des accès clients
    url: https://veille.vigiao.fr/api/health/ao-provisioning
    slug: provisionnement-acces-clients
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

# Chaque incident ouvre une issue assignée : notification e-mail GitHub immédiate.
assignees:
  - inotekk

# Le top départ des sondes vient du Worker Cloudflare (worker/, cron toutes
# les 5 minutes) car les crons GitHub Actions dérivent trop aux heures de
# charge. Le cron ci-dessous n'est qu'un filet de sécurité quotidien au cas
# où le Worker cesserait d'appeler GitHub.
workflowSchedule:
  uptime: "41 4 * * *"

status-website:
  # Rafraîchissement des données publiques après un rétablissement.
  productionCacheTime: 30000
  cname: status.vigiao.fr
  name: Statut VIGIAO
  introTitle: "**Statut VIGIAO** — disponibilité des services en temps réel"
  introMessage: Page de statut officielle de la plateforme VIGIAO (Inotekk). Les mesures sont effectuées toutes les 5 minutes depuis une infrastructure indépendante de nos serveurs.
  navbar:
    - title: Statut
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

